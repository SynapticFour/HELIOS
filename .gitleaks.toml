# Gitleaks 8.24.3 (pinned in .github/workflows/secret-scan.yml).
# Extend defaults — a bare config without useDefault would replace all rules.
#
# Linux CI can occasionally false-positive the default `sidekiq-secret` rule on
# Markdown that links to `.github/workflows/*.yml` (same content passes on macOS
# with the stock config). Allowlist README for that rule only.
#
# `generic-api-key` matches `name="testkey", allow_unencrypted=True` because
# `key` + comma + the kwarg looks like `key = <secret>`. The kwarg is not a
# credential; git history still contains the line so a rule allowlist is required.

[extend]
useDefault = true

[[rules]]
id = "sidekiq-secret"
[rules.allowlist]
paths = ["README.md"]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Python kwarg allow_unencrypted=True is not a credential"
  regexTarget = "secret"
  regexes = [
    '''^allow_unencrypted\s*=\s*True$''',
  ]
