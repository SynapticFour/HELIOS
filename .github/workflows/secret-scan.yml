name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Use filesystem scan (--no-git) so the first push to a new repo does not
      # fail when gitleaks-action builds a git range like root^..HEAD (root^ is invalid).
      # Extract into a temp dir — the release tarball ships its own README.md /
      # LICENSE and would overwrite the repo tree if unpacked in $GITHUB_WORKSPACE.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          tmp="$(mktemp -d)"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git --verbose --config .gitleaks.toml
