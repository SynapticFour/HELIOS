name: Release

# Publishes helios-audit to PyPI when an annotated tag matching v* is pushed.
# Requires PyPI Trusted Publisher for this repo + project name helios-audit.
# See RELEASING.md — do not push v0.1.0 until Trusted Publisher is configured.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/ tests/
      - name: Mypy
        run: mypy src/helios/
      - name: Pytest
        run: pytest tests/ -q --cov=helios --cov-fail-under=80

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publisher
      contents: write  # attach SBOM to GitHub Release when tag is a GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify package metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = data["project"]["version"]
          assert name == "helios-audit", name
          print(f"Publishing {name}=={version}")
          init = pathlib.Path("src/helios/__init__.py").read_text(encoding="utf-8")
          assert f'__version__ = "{version}"' in init, "pyproject version must match helios.__version__"
          PY
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m pip install "cyclonedx-bom>=5"
          pip install -e .
          cyclonedx-py environment -o helios-sbom.cdx.json --of JSON
          shasum -a 256 helios-sbom.cdx.json pyproject.toml requirements.lock > SHA256SUMS-sbom.txt
          python - <<'PY'
          import hashlib, json, os, pathlib
          payload = {
              "project": "helios-audit",
              "git_tag": os.environ["GITHUB_REF_NAME"],
              "git_sha": os.environ["GITHUB_SHA"],
              "pyproject_sha256": hashlib.sha256(pathlib.Path("pyproject.toml").read_bytes()).hexdigest(),
              "requirements_lock_sha256": hashlib.sha256(pathlib.Path("requirements.lock").read_bytes()).hexdigest(),
              "sbom": "helios-sbom.cdx.json",
              "note": "Unsigned provenance JSON. Prefer the GitHub artifact checksums and PyPI Trusted Publisher.",
          }
          pathlib.Path("helios-lockfile-attestation.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - name: Upload SBOM artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: helios-sbom
          path: |
            helios-sbom.cdx.json
            SHA256SUMS-sbom.txt
            helios-lockfile-attestation.json
            requirements.lock
      - name: Attach SBOM to GitHub Release (if release exists for tag)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            helios-sbom.cdx.json
            SHA256SUMS-sbom.txt
            helios-lockfile-attestation.json
            requirements.lock
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
