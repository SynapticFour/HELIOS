name: Release

# Publishes helios-audit to PyPI when an annotated tag matching v* is pushed.
# Requires PyPI Trusted Publisher for this repo + project name helios-audit.
# See RELEASING.md — do not push v0.1.0 until Trusted Publisher is configured.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publisher
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify package metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = data["project"]["version"]
          assert name == "helios-audit", name
          print(f"Publishing {name}=={version}")
          init = pathlib.Path("src/helios/__init__.py").read_text(encoding="utf-8")
          assert f'__version__ = "{version}"' in init, "pyproject version must match helios.__version__"
          PY
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
