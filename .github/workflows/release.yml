name: Release

# Publishes helios-audit to PyPI when an annotated tag matching v* is pushed.
# Requires PyPI Trusted Publisher for this repo + project name helios-audit.
# See RELEASING.md — do not push v0.1.0 until Trusted Publisher is configured.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publisher
      contents: write  # attach SBOM to GitHub Release when tag is a GitHub release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify package metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = data["project"]["version"]
          assert name == "helios-audit", name
          print(f"Publishing {name}=={version}")
          init = pathlib.Path("src/helios/__init__.py").read_text(encoding="utf-8")
          assert f'__version__ = "{version}"' in init, "pyproject version must match helios.__version__"
          PY
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist
      - name: Generate CycloneDX SBOM + lockfile attestation
        run: |
          set -euo pipefail
          python -m pip install "cyclonedx-bom>=5"
          # Prefer lockfile/requirements style attestation of the built environment
          pip install -e .
          cyclonedx-py environment -o helios-sbom.cdx.json --of JSON
          shasum -a 256 helios-sbom.cdx.json pyproject.toml > SHA256SUMS-sbom.txt
          # Attest pinned project metadata for the tag
          {
            echo "{"
            echo "  \"project\": \"helios-audit\","
            echo "  \"git_tag\": \"${GITHUB_REF_NAME}\","
            echo "  \"git_sha\": \"${GITHUB_SHA}\","
            echo "  \"pyproject_sha256\": \"$(shasum -a 256 pyproject.toml | awk '{print $1}')\","
            echo "  \"sbom\": \"helios-sbom.cdx.json\""
            echo "}"
          } > helios-lockfile-attestation.json
          cat helios-lockfile-attestation.json
      - name: Upload SBOM artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: helios-sbom
          path: |
            helios-sbom.cdx.json
            SHA256SUMS-sbom.txt
            helios-lockfile-attestation.json
      - name: Attach SBOM to GitHub Release (if release exists for tag)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            helios-sbom.cdx.json
            SHA256SUMS-sbom.txt
            helios-lockfile-attestation.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
