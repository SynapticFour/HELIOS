version: "3.9"

services:
  helios-dashboard:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./helios-data:/root/.helios
    environment:
      # Required — set in the shell or a local `.env` next to this file.
      HELIOS_DASHBOARD_API_KEY: ${HELIOS_DASHBOARD_API_KEY:?Set HELIOS_DASHBOARD_API_KEY before `make up`}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["helios", "serve", "--host", "0.0.0.0", "--port", "8765", "--no-open-browser"]
